name: Deploy

on:
  push:
    branches: [main]

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'

  build-check-backend:
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        working-directory: backend
        run: npm ci
      - name: Build
        working-directory: backend
        run: npm run build

  build-check-frontend:
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Build
        working-directory: frontend
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}

  deploy:
    needs: [detect-changes, build-check-backend, build-check-frontend]
    if: |
      always() &&
      (needs.build-check-backend.result == 'success' || needs.build-check-backend.result == 'skipped') &&
      (needs.build-check-frontend.result == 'success' || needs.build-check-frontend.result == 'skipped') &&
      (needs.detect-changes.outputs.backend == 'true' || needs.detect-changes.outputs.frontend == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          command_timeout: 20m
          script: |
            set -e
            cd ~/kawaltransaksi
            git fetch origin main
            git reset --hard origin/main

            if [ "${{ needs.detect-changes.outputs.backend }}" = "true" ]; then
              echo "Rebuilding backend..."
              docker compose up -d --build --force-recreate backend
              echo "Waiting for backend to be healthy..."
              for i in $(seq 1 30); do
                if curl -sf http://127.0.0.1:4000/health > /dev/null 2>&1; then
                  echo "Backend is healthy."
                  break
                fi
                if [ "$i" = "30" ]; then
                  echo "Backend failed to become healthy after 60s"
                  docker logs kawaltransaksi-backend-1 --tail 50
                  exit 1
                fi
                sleep 2
              done
            fi

            if [ "${{ needs.detect-changes.outputs.frontend }}" = "true" ]; then
              echo "Rebuilding frontend..."
              docker compose up -d --build --force-recreate frontend
              echo "Waiting for frontend to be healthy..."
              for i in $(seq 1 30); do
                if curl -sf http://127.0.0.1:3000 > /dev/null 2>&1; then
                  echo "Frontend is healthy."
                  break
                fi
                if [ "$i" = "30" ]; then
                  echo "Frontend failed to become healthy after 60s"
                  docker logs kawaltransaksi-frontend-1 --tail 50
                  exit 1
                fi
                sleep 2
              done
            fi