user nginx;

worker_processes auto;

pid /run/nginx.pid;


# ============================================================================
# EVENTS
# ============================================================================

events {
    worker_connections 4096;
}


# ============================================================================
# HTTP
# ============================================================================

http {

    # =========================================================================
    # BASIC
    # =========================================================================

    include /etc/nginx/mime.types;

    default_type application/octet-stream;

    sendfile on;

    tcp_nopush on;

    tcp_nodelay on;

    keepalive_timeout 65;

    server_tokens off;


    # =========================================================================
    # LOG
    # =========================================================================

    access_log /var/log/nginx/access.log;

    error_log /var/log/nginx/error.log warn;


    # =========================================================================
    # CLOUDFLARE REAL IP
    # =========================================================================

    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;

    real_ip_header CF-Connecting-IP;


    # =========================================================================
    # CLOUDFLARE ONLY
    #
    # $realip_remote_addr = alamat IP koneksi asli yang masuk ke Nginx.
    #
    # Jika IP asli tersebut bukan IP Cloudflare → block.
    #
    # 0 = Cloudflare
    # 1 = direct access
    # =========================================================================

    geo $blocked_direct_access {

        default 1;

        103.21.244.0/22 0;
        103.22.200.0/22 0;
        103.31.4.0/22 0;
        104.16.0.0/13 0;
        104.24.0.0/14 0;
        108.162.192.0/18 0;
        131.0.72.0/22 0;
        141.101.64.0/18 0;
        162.158.0.0/15 0;
        172.64.0.0/13 0;
        173.245.48.0/20 0;
        188.114.96.0/20 0;
        190.93.240.0/20 0;
        197.234.240.0/22 0;
        198.41.128.0/17 0;
    }


    # =========================================================================
    # NEXT.JS PREFETCH
    # =========================================================================

    map "$http_rsc:$http_next_router_prefetch" $frontend_key {

        default $binary_remote_addr;

        "1:1" "";
    }


    map "$http_rsc:$http_next_router_prefetch" $frontend_prefetch_key {

        default "";

        "1:1" $binary_remote_addr;
    }


    # =========================================================================
    # RATE LIMIT — FRONTEND NORMAL
    #
    # 10 request/detik per IP
    # burst dikonfigurasi di kawaltransaksi.conf
    # =========================================================================

    limit_req_zone
        $frontend_key
        zone=frontend:10m
        rate=10r/s;


    # =========================================================================
    # RATE LIMIT — NEXT.JS PREFETCH
    #
    # 50 request/detik per IP
    # =========================================================================

    limit_req_zone
        $frontend_prefetch_key
        zone=frontend_prefetch:10m
        rate=50r/s;


    # =========================================================================
    # RATE LIMIT — API
    #
    # 300 request/menit
    # = 5 request/detik
    # =========================================================================

    limit_req_zone
        $binary_remote_addr
        zone=api:10m
        rate=5r/s;


    # =========================================================================
    # CONNECTION LIMIT — SSE
    #
    # Maksimal 10 koneksi bersamaan per IP.
    # =========================================================================

    limit_conn_zone
        $binary_remote_addr
        zone=sse_per_ip:10m;


    # =========================================================================
    # SITE CONFIG
    # =========================================================================

    include /etc/nginx/conf.d/*.conf;
}