# kawaltransaksi.com — frontend
server {
    listen 80;
    server_name kawaltransaksi.com www.kawaltransaksi.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name kawaltransaksi.com www.kawaltransaksi.com;

    ssl_certificate     /etc/ssl/kawaltransaksi/cert.pem;
    ssl_certificate_key /etc/ssl/kawaltransaksi/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Cloudflare real IP
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    real_ip_header CF-Connecting-IP;

    # === tolak request yang tidak lewat Cloudflare ===
    if ($blocked_direct_access) {
        return 403;
    }

    # Rate limiting (sama seperti backend: ~5 req/detik rata-rata per IP,
    # burst 50 tanpa delay untuk lonjakan singkat yang wajar)
    limit_req zone=frontend burst=50 nodelay;

    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;
    }
}

# api.kawaltransaksi.com — backend
server {
    listen 80;
    server_name api.kawaltransaksi.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name api.kawaltransaksi.com;

    ssl_certificate     /etc/ssl/kawaltransaksi/cert.pem;
    ssl_certificate_key /etc/ssl/kawaltransaksi/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Cloudflare real IP
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    real_ip_header CF-Connecting-IP;

    # === tolak request yang tidak lewat Cloudflare ===
    if ($blocked_direct_access) {
        return 403;
    }

    # Upload limit
    client_max_body_size 6M;

    # Rate limiting
    limit_req zone=api burst=50 nodelay;

    # SSE realtime stream: koneksi hidup lama, bukan banyak request. limit_req
    # (req/detik) adalah alat yang salah di sini -- override dengan zone longgar
    # (burst 1000) supaya praktis tidak membatasi, alih-alih mewarisi
    # `burst=50` dari server block. Pembatasan yang benar untuk koneksi
    # long-lived: limit_conn (jumlah koneksi bersamaan per IP) di bawah.
    # limit_conn butuh baris berikut di block http{} pada nginx.conf utama
    # (belum tentu sudah ada):
    #     limit_conn_zone $binary_remote_addr zone=sse_per_ip:10m;
    # $binary_remote_addr di sini sudah = CF-Connecting-IP karena real_ip_header.
    location = /api/reports/stream {
        limit_req  zone=api burst=1000 nodelay;
        limit_conn sse_per_ip 10;
        limit_conn_status 503;
        proxy_pass          http://127.0.0.1:4000;
        proxy_http_version  1.1;
        proxy_set_header    Host $host;
        proxy_set_header    X-Real-IP $remote_addr;
        proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
        proxy_set_header    Connection '';
        proxy_buffering     off;
        proxy_cache         off;
        proxy_read_timeout  3600s;
        chunked_transfer_encoding off;
        add_header          X-Accel-Buffering no;
    }

    location / {
        proxy_pass         http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}