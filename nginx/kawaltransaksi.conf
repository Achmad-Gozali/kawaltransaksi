# kawaltransaksi.com — frontend & api
#
# ===========================================================================
# WAJIB ditambahkan ke block http{} di /etc/nginx/nginx.conf (map & limit_req_zone
# hanya valid di context http, tidak bisa di file ini). Tanpa ini `nginx -t` gagal
# karena zone `frontend_prefetch` belum terdefinisi.
#
#   # Next.js App Router memprefetch SEMUA <Link> yang terlihat begitu satu
#   # halaman dibuka -> puluhan request RSC serentak dari 1 IP, menabrak
#   # limit_req dan bikin nginx balas 429/503 ke pengunjung asli.
#   # Request prefetch dikenali dari header Next-Router-Prefetch: 1 ATAU
#   # Next-Router-Segment-Prefetch (Next 16 segment cache). Navigasi RSC biasa
#   # (klik, 1 per aksi) TIDAK membawa header ini -> tetap dibatasi normal.
#   map "$http_next_router_prefetch$http_next_router_segment_prefetch" $is_rsc_prefetch {
#       ""      "";
#       default "1";
#   }
#   # request BUKAN prefetch -> key = IP asli (zone frontend ketat),
#   #                           key = "" di zone prefetch (tidak dihitung).
#   map $is_rsc_prefetch $frontend_key {
#       ""      $binary_remote_addr;
#       default "";
#   }
#   # request prefetch -> kebalikannya.
#   map $is_rsc_prefetch $frontend_prefetch_key {
#       ""      "";
#       default $binary_remote_addr;
#   }
#
#   # GANTI baris `limit_req_zone ... zone=frontend ...` yang sekarang jadi:
#   limit_req_zone $frontend_key          zone=frontend:10m          rate=5r/s;
#   # zone baru khusus prefetch: jauh lebih longgar, tetap berpagar (anti-scrape RSC):
#   limit_req_zone $frontend_prefetch_key zone=frontend_prefetch:10m rate=30r/s;
#
#   # (zone `api` & limit_conn_zone `sse_per_ip` tetap seperti sekarang.)
#
# VARIAN LEBIH SEDERHANA (kalau tak mau tambah zone): cukup map $frontend_key +
# ganti key zone `frontend` jadi $frontend_key, lalu HAPUS baris
# `limit_req zone=frontend_prefetch ...` di bawah. Efeknya prefetch RSC
# sepenuhnya tidak dibatasi per-IP (masih di belakang rate-limit Cloudflare).
# ===========================================================================

# ── frontend ────────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name kawaltransaksi.com www.kawaltransaksi.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name kawaltransaksi.com www.kawaltransaksi.com;

    ssl_certificate     /etc/ssl/kawaltransaksi/cert.pem;
    ssl_certificate_key /etc/ssl/kawaltransaksi/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Cloudflare real IP
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    real_ip_header CF-Connecting-IP;

    # === tolak request yang tidak lewat Cloudflare ===
    if ($blocked_direct_access) {
        return 403;
    }

    # ── Rate limiting ──────────────────────────────────────────────────────
    # PELAJARAN DARI BUG 503: `limit_req_status` dan `error_page` HARUS hidup di
    # block yang SAMA dengan directive `limit_req` yang mereka atur. Versi lama
    # menaruh `limit_req` di server{} dan mengandalkan `limit_req_status 429`
    # ter-merge server->location. Di config ini merge-nya TIDAK sampai ke
    # `location /` (limit_req_status bahkan hilang total dari block frontend di
    # file terdeploy) -> penolakan limiter keluar dengan status DEFAULT 503,
    # dan tanpa `error_page 503` -> halaman "503 Service Temporarily
    # Unavailable" polos bawaan nginx.
    #
    # Perbaikan:
    #  1. `limit_req` + status + error_page SEMUANYA di `location /`.
    #  2. error_page menangkap 429 DAN 503; `= @ratelimited` memaksa status
    #     final = yang di-`return` named location (429).
    #  3. `@ratelimited` dibebaskan dari limiter (limit_req/limit_conn off) biar
    #     internal-redirect error page tidak dihitung/ditolak ulang.
    #  4. Status di server-level = jaring untuk location lain (TANPA `limit_req`
    #     di server-level -> tidak ada double counting).
    #  Aman thd 503 ASLI Next.js: proxy_intercept_errors off (default) => error
    #  dari upstream tidak ditangkap error_page, hanya error internal nginx.
    limit_req_status  429;
    limit_conn_status 429;
    error_page 429 503 = @ratelimited;

    location @ratelimited {
        limit_req  off;
        limit_conn off;
        default_type text/html;
        add_header Retry-After 10 always;
        add_header Cache-Control "no-store" always;
        return 429 '<!doctype html><html lang="id"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Terlalu banyak permintaan</title><body style="font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;max-width:34rem;margin:14vh auto;padding:0 1.5rem;color:#1e293b;text-align:center"><h1 style="font-size:1.3rem;margin:0 0 .6rem">Sebentar ya…</h1><p style="line-height:1.6;color:#475569">Terlalu banyak permintaan dari koneksi Anda dalam waktu singkat. Ini pembatasan sementara — situs KawalTransaksi <strong>tidak sedang bermasalah</strong>.</p><p style="line-height:1.6;color:#475569">Tunggu sekitar <strong>10 detik</strong>, lalu muat ulang halaman.</p><p style="margin-top:2rem"><a href="/" style="color:#047857;font-weight:700;text-decoration:none">&larr; Kembali ke beranda</a></p></body></html>';
    }

    location / {
        # limit_req + status + error_page HIDUP BERSAMA di sini.
        #  - `frontend`          : navigasi & HTML biasa (~5 r/s + burst 50/IP).
        #                          Request prefetch RSC tidak dihitung di sini
        #                          (key jadi "" lewat map $frontend_key).
        #  - `frontend_prefetch` : khusus badai prefetch <Link> App Router.
        #                          Non-prefetch tidak dihitung di sini. Burst 200
        #                          menyerap IP CGNAT (mobile) yang dipakai banyak
        #                          pengunjung -> ratusan request RSC nyaris
        #                          bersamaan, murah & sebagian besar ke-cache.
        #                          Navigasi nyata tetap ketat, tidak bisa
        #                          "kehabisan jatah" gara-gara prefetch.
        limit_req zone=frontend          burst=50  nodelay;
        limit_req zone=frontend_prefetch burst=200 nodelay;
        limit_req_status  429;
        limit_conn_status 429;
        error_page 429 503 = @ratelimited;

        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;
    }
}

# ── api.kawaltransaksi.com — backend ────────────────────────────────────────
server {
    listen 80;
    server_name api.kawaltransaksi.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name api.kawaltransaksi.com;

    ssl_certificate     /etc/ssl/kawaltransaksi/cert.pem;
    ssl_certificate_key /etc/ssl/kawaltransaksi/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Cloudflare real IP
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    real_ip_header CF-Connecting-IP;

    # === tolak request yang tidak lewat Cloudflare ===
    if ($blocked_direct_access) {
        return 403;
    }

    # Upload limit
    client_max_body_size 6M;

    # ── Rate limiting ──────────────────────────────────────────────────────
    # Sama seperti block frontend: `limit_req` + status + error_page hidup
    # bareng di masing-masing location, TIDAK mengandalkan merge server->location.
    # Server-level status = jaring saja (tanpa `limit_req` di server-level ->
    # tidak ada double counting).
    limit_req_status  429;
    limit_conn_status 429;
    # HANYA 429 di server-level. `error_page 503` JANGAN di sini -- endpoint SSE
    # (location = /api/reports/stream) sengaja balas 503.
    error_page 429 = @ratelimited_api;

    # Klien API mengharapkan JSON. Backend (@fastify/rate-limit) sudah balas 429
    # JSON sendiri dan diteruskan apa adanya (proxy_intercept_errors off).
    # Handler ini HANYA untuk 429/503 yang digenerate nginx (limit_req),
    # supaya tetap JSON dengan bentuk konsisten, bukan HTML polos.
    location @ratelimited_api {
        limit_req  off;
        limit_conn off;
        default_type application/json;
        add_header Retry-After 10 always;
        add_header Cache-Control "no-store" always;
        return 429 '{"statusCode":429,"error":"Terlalu banyak permintaan dari koneksi Anda. Coba lagi dalam beberapa detik."}';
    }

    # SSE realtime stream: koneksi hidup lama, bukan banyak request. limit_req
    # (req/detik) adalah alat yang salah di sini -- override dengan zone longgar
    # (burst 1000) supaya praktis tidak membatasi, alih-alih mewarisi
    # `burst=50` dari server block. Pembatasan yang benar untuk koneksi
    # long-lived: limit_conn (jumlah koneksi bersamaan per IP) di bawah.
    # limit_conn butuh baris berikut di block http{} pada nginx.conf utama
    # (belum tentu sudah ada):
    #     limit_conn_zone $binary_remote_addr zone=sse_per_ip:10m;
    # $binary_remote_addr di sini sudah = CF-Connecting-IP karena real_ip_header.
    location = /api/reports/stream {
        limit_req  zone=api burst=1000 nodelay;
        limit_conn sse_per_ip 10;
        # SSE sengaja 503 (bukan 429): EventSource auto-reconnect, dan backend
        # sendiri balas 503 saat stream penuh (lihat reports.route.ts). Di-set
        # EKSPLISIT di sini, tidak mengandalkan warisan. TIDAK ada error_page
        # 503 yang menangkap ini (server-level cuma error_page 429), jadi klien
        # menerima 503 apa adanya -- persis yang diinginkan.
        limit_req_status  503;
        limit_conn_status 503;
        proxy_pass          http://127.0.0.1:4000;
        proxy_http_version  1.1;
        proxy_set_header    Host $host;
        proxy_set_header    X-Real-IP $remote_addr;
        proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
        proxy_set_header    Connection '';
        proxy_buffering     off;
        proxy_cache         off;
        proxy_read_timeout  3600s;
        chunked_transfer_encoding off;
        add_header          X-Accel-Buffering no;
    }

    location / {
        # limit_req + status + error_page HIDUP BERSAMA di sini. `error_page 503`
        # ditaruh DI location ini (bukan server) supaya location SSE di atas
        # tidak ikut kena -> SSE tetap 503, endpoint API biasa dapat 429 JSON.
        limit_req zone=api burst=50 nodelay;
        limit_req_status  429;
        limit_conn_status 429;
        error_page 429 503 = @ratelimited_api;

        proxy_pass         http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
