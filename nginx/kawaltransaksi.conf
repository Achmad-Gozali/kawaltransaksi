# kawaltransaksi.com — frontend & api
#
# ============================================================================
# CONFIG FRONTEND + API
#
# Rate-limit zone:
#
#   frontend
#   frontend_prefetch
#   api
#   sse_per_ip
#
# didefinisikan di /etc/nginx/nginx.conf pada block http{}.
# ============================================================================


# ============================================================================
# kawaltransaksi.com — FRONTEND
# ============================================================================


# ── FRONTEND HTTP → HTTPS ───────────────────────────────────────────────────

server {

    listen 80;

    server_name
        kawaltransaksi.com
        www.kawaltransaksi.com;

    return 301 https://$host$request_uri;
}


# ── FRONTEND HTTPS ──────────────────────────────────────────────────────────

server {

    listen 443 ssl;

    server_name
        kawaltransaksi.com
        www.kawaltransaksi.com;


    # =========================================================================
    # SSL
    # =========================================================================

    ssl_certificate
        /etc/ssl/kawaltransaksi/cert.pem;

    ssl_certificate_key
        /etc/ssl/kawaltransaksi/key.pem;

    ssl_protocols TLSv1.2 TLSv1.3;

    ssl_ciphers HIGH:!aNULL:!MD5;


    # =========================================================================
    # CLOUDFLARE REAL IP
    # =========================================================================

    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;

    real_ip_header CF-Connecting-IP;


    # =========================================================================
    # TOLAK REQUEST YANG TIDAK MELALUI CLOUDFLARE
    # =========================================================================

    if ($blocked_direct_access) {

        return 403;
    }


    # =========================================================================
    # RATE LIMIT STATUS
    # =========================================================================

    limit_req_status 429;

    limit_conn_status 429;

    error_page 429 503 = @ratelimited;


    # =========================================================================
    # RATE-LIMITED PAGE
    # =========================================================================

    location @ratelimited {

        limit_req off;

        limit_conn off;

        default_type text/html;

        add_header Retry-After 10 always;

        add_header Cache-Control "no-store" always;


        return 429 '<!doctype html><html lang="id"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Permintaan Sementara Dibatasi</title><body style="font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;max-width:34rem;margin:14vh auto;padding:0 1.5rem;color:#1e293b;text-align:center"><h1 style="font-size:1.3rem;margin:0 0 .6rem">Permintaan Sementara Dibatasi</h1><p style="line-height:1.6;color:#475569">Untuk menjaga keamanan dan kestabilan layanan, jumlah permintaan dari koneksi Anda sedang dibatasi sementara.</p><p style="line-height:1.6;color:#475569">Silakan tunggu beberapa saat, kemudian coba kembali.</p><p style="margin-top:2rem"><a href="/" style="color:#047857;font-weight:700;text-decoration:none">&larr; Kembali ke beranda</a></p></body></html>';
    }


    # =========================================================================
    # FRONTEND
    # =========================================================================

    location / {


        # =====================================================================
        # REQUEST NORMAL / NAVIGASI
        #
        # 10 request/detik per IP
        # burst 100
        #
        # Request Next.js prefetch menggunakan key kosong pada zone ini.
        # =====================================================================

        limit_req zone=frontend burst=100 nodelay;


        # =====================================================================
        # NEXT.JS APP ROUTER PREFETCH
        #
        # 50 request/detik per IP
        # burst 500
        #
        # Request normal menggunakan key kosong pada zone ini.
        # =====================================================================

        limit_req zone=frontend_prefetch burst=500 nodelay;


        # =====================================================================
        # RATE LIMIT STATUS
        # =====================================================================

        limit_req_status 429;

        limit_conn_status 429;

        error_page 429 503 = @ratelimited;


        # =====================================================================
        # PROXY NEXT.JS
        # =====================================================================

        proxy_pass http://127.0.0.1:3000;

        proxy_http_version 1.1;


        proxy_set_header Host $host;

        proxy_set_header X-Real-IP $remote_addr;

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_set_header X-Forwarded-Proto $scheme;


        proxy_set_header Upgrade $http_upgrade;

        proxy_set_header Connection "upgrade";

        proxy_cache_bypass $http_upgrade;
    }
}



# ============================================================================
# api.kawaltransaksi.com — BACKEND
# ============================================================================


# ── API HTTP → HTTPS ─────────────────────────────────────────────────────────

server {

    listen 80;

    server_name api.kawaltransaksi.com;

    return 301 https://$host$request_uri;
}



# ── API HTTPS ────────────────────────────────────────────────────────────────

server {

    listen 443 ssl;

    server_name api.kawaltransaksi.com;


    # =========================================================================
    # SSL
    # =========================================================================

    ssl_certificate
        /etc/ssl/kawaltransaksi/cert.pem;

    ssl_certificate_key
        /etc/ssl/kawaltransaksi/key.pem;

    ssl_protocols TLSv1.2 TLSv1.3;

    ssl_ciphers HIGH:!aNULL:!MD5;


    # =========================================================================
    # CLOUDFLARE REAL IP
    # =========================================================================

    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;

    real_ip_header CF-Connecting-IP;


    # =========================================================================
    # TOLAK REQUEST YANG TIDAK MELALUI CLOUDFLARE
    # =========================================================================

    if ($blocked_direct_access) {

        return 403;
    }


    # =========================================================================
    # UPLOAD LIMIT
    # =========================================================================

    client_max_body_size 6M;


    # =========================================================================
    # API RATE LIMIT STATUS
    # =========================================================================

    limit_req_status 429;

    limit_conn_status 429;


    # Hanya 429 yang diarahkan ke rate-limited response.
    #
    # SSE menggunakan 503 secara sengaja sehingga tidak ditangkap
    # oleh error_page 503 di level server.

    error_page 429 = @ratelimited_api;


    # =========================================================================
    # API RATE-LIMITED RESPONSE
    # =========================================================================

    location @ratelimited_api {

        limit_req off;

        limit_conn off;

        default_type application/json;

        add_header Retry-After 10 always;

        add_header Cache-Control "no-store" always;


        return 429 '{"statusCode":429,"error":"Terlalu banyak permintaan dari koneksi Anda. Coba lagi dalam beberapa detik."}';
    }


    # =========================================================================
    # SSE REALTIME STREAM
    # =========================================================================

    location = /api/reports/stream {


        # =====================================================================
        # SSE RATE LIMIT
        #
        # Request rate diberi burst besar karena SSE merupakan koneksi
        # long-lived.
        # =====================================================================

        limit_req zone=api burst=1000 nodelay;


        # Maksimal 10 koneksi SSE bersamaan per IP.

        limit_conn sse_per_ip 10;


        # =====================================================================
        # SSE STATUS
        #
        # SSE menggunakan 503 ketika dibatasi.
        # =====================================================================

        limit_req_status 503;

        limit_conn_status 503;


        # =====================================================================
        # PROXY BACKEND
        # =====================================================================

        proxy_pass http://127.0.0.1:4000;

        proxy_http_version 1.1;


        proxy_set_header Host $host;

        proxy_set_header X-Real-IP $remote_addr;

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_set_header X-Forwarded-Proto $scheme;


        # Jangan gunakan Connection: upgrade untuk SSE.

        proxy_set_header Connection "";


        # =====================================================================
        # SSE BUFFERING
        # =====================================================================

        proxy_buffering off;

        proxy_cache off;

        proxy_read_timeout 3600s;

        chunked_transfer_encoding off;

        add_header X-Accel-Buffering no;
    }


    # =========================================================================
    # API NORMAL
    # =========================================================================

    location / {


        # =====================================================================
        # API RATE LIMIT
        #
        # 300 request/menit/IP
        # = 5 request/detik
        #
        # burst 50
        # =====================================================================

        limit_req zone=api burst=50 nodelay;

        limit_req_status 429;

        limit_conn_status 429;

        error_page 429 503 = @ratelimited_api;


        # =====================================================================
        # PROXY FASTIFY BACKEND
        # =====================================================================

        proxy_pass http://127.0.0.1:4000;

        proxy_http_version 1.1;


        proxy_set_header Host $host;

        proxy_set_header X-Real-IP $remote_addr;

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_set_header X-Forwarded-Proto $scheme;


        proxy_read_timeout 30s;
    }
}